# aqua — Declarative CLI Version Manager — https://aquaproj.github.io/
checksum:
  enabled: true
  require_checksum: true
  supported_envs:
    - darwin/arm64
    - linux/amd64
    - linux/arm64
    - windows/amd64
    - windows/arm64

registries:
  - type: standard
    ref: v4.578.0 # renovate: depName=aquaproj/aqua-registry
  - name: local
    type: local
    path: ../.limen/hermetic-registry.yaml

packages:
  # The limen this repository runs, and with it every canonical file it
  # writes: the one canonical pin kept here, where Renovate bumps it.
  - name: farcloser/limen@v0.16.0 # renovate: depName=farcloser/limen
    registry: local
  # This repository's own tools, beyond limen's canonical set: yq for the
  # issue-forms validation (.justfile).
  - name: mikefarah/yq@v4.54.1
  # The Go toolchain is each repository's own pin (book/tooling.md): it builds
  # the tools/go.mod tools, and a standard-library fix must not wait for a
  # limen release.
  - name: golang/go@go1.27.3
  # Every other tool limen requires comes from the import, at the versions
  # this limen pins: a limen bump changes that file, never this list
  # (book/tooling.md).
  - import: ../.limen/hermetic.yaml
